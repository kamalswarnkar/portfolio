<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
  <!-- Outer dark ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#2a2a2a" stroke-width="3"/>
  <!-- Glowing green ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.7"/>
  <!-- Inner dark background for the hourglass area -->
  <circle cx="32" cy="32" r="20" fill="radial-gradient(circle, #0d200d, #040404 70%)"/>
  <circle cx="32" cy="32" r="20" fill="#0c1a0c"/>
  <!-- Green glowing core -->
  <circle cx="32" cy="32" r="18" fill="#1a4010" opacity="0.9"/>
  <circle cx="32" cy="32" r="16" fill="url(#core-grad)"/>
  <!-- Hourglass/X symbol paths (black on green) -->
  <!-- vertical bar -->
  <rect x="30.5" y="20" width="3" height="24" rx="1" fill="#050505"/>
  <!-- top-left to bottom-right slash (upper triangle mask) -->
  <polygon points="24,20 40,20 32,28" fill="#050505"/>
  <!-- bottom slash -->
  <polygon points="24,44 40,44 32,36" fill="#050505"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="2" fill="white" opacity="0.95"/>
  <!-- Defs -->
  <defs>
    <radialGradient id="core-grad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8cff5a"/>
      <stop offset="40%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#0e3a08"/>
    </radialGradient>
  </defs>
</svg>
